<ion-header class="ion-no-border">
  <ion-toolbar>
    @switch (leading()) {
      @case ('menu') {
        <ion-buttons slot="start">
          <ion-menu-button class="header__menu" [autoHide]="false" aria-label="Abrir menú">
            <span class="hamburger" aria-hidden="true"></span>
          </ion-menu-button>
        </ion-buttons>
      }
      @case ('back') {
        <ion-buttons slot="start">
          <ion-back-button
            class="header__back"
            text=""
            [icon]="backIcon"
            [defaultHref]="backHref()"
            aria-label="Volver"
          />
        </ion-buttons>
      }
    }
    <ion-title>{{ title() }}</ion-title>
  </ion-toolbar>
</ion-header>
